<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truck Booking</title>
<style>
  :root { --bg:#eef1f5; --card:#fff; --text:#111827; --muted:#6b7280; --accent:#d97706; --border:#d1d5db; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; justify-content:center; background:var(--bg);
         color:var(--text); font-family:system-ui,Arial,sans-serif; padding:16px; }
  .card { background:var(--card); width:100%; max-width:480px; padding:24px; border-radius:14px;
          box-shadow:0 4px 18px rgba(0,0,0,.1); align-self:flex-start; }
  h1 { margin:0 0 4px; font-size:22px; }
  p.sub { margin:0 0 12px; color:var(--muted); font-size:14px; }
  label { display:block; margin:14px 0 6px; font-weight:600; font-size:14px; }
  .req::after { content:" *"; color:#dc2626; }
  input, select, textarea { width:100%; padding:12px; font-size:16px; border:1px solid var(--border);
          border-radius:8px; background:#fff; font-family:inherit; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); border-color:var(--accent); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .up { text-transform:uppercase; }
  button { margin-top:22px; width:100%; padding:14px; font-size:16px; font-weight:700; color:#fff;
           background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #msg { margin-top:14px; padding:12px; border-radius:8px; font-size:14px; text-align:center; display:none; }
  .ok { display:block !important; background:#dcfce7; color:#166534; }
  .err { display:block !important; background:#fee2e2; color:#991b1b; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="card">
  <h1>🚚 Truck Booking</h1>
  <p class="sub">Roxas → Batangas. Fields marked * are required.</p>

  <form id="f" autocomplete="off">
    <div class="row">
      <div>
        <label class="req" for="date">Departure Date</label>
        <input id="date" type="date" required>
      </div>
      <div>
        <label for="time">Time</label>
        <select id="time"><option>1:00 AM</option><option>1:00 PM</option></select>
      </div>
    </div>

    <label for="type">Type of Vehicle</label>
    <select id="type">
      <option selected>10W</option><option>20FTR</option><option>40FTR</option>
      <option>FWD</option><option>ELF</option><option>6W</option><option>12W</option><option>Other</option>
    </select>
    <input id="typeOther" class="up" placeholder="Type the vehicle type" hidden style="margin-top:8px">

    <label class="req" for="company">Company Name</label>
    <input id="company" class="up" required>

    <label class="req" for="plate">Plate Number</label>
    <input id="plate" class="up" required placeholder="e.g. CCR 8351">

    <label for="contact">Contact Number</label>
    <input id="contact" type="tel" placeholder="e.g. 09218010894">

    <label for="remarks">Remarks</label>
    <textarea id="remarks" class="up" rows="2"></textarea>

    <label class="req" for="bookedBy">Booked By</label>
    <input id="bookedBy" class="up" required>

    <button id="btn" type="submit">Submit Booking</button>
    <div id="msg"></div>
  </form>
</div>

<script>
  // STANDALONE VERSION ONLY: paste your Web App URL (ends with /exec). Leave as is inside Apps Script.
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCy0IRch4NB5IcZpUnGnHDVKhiSQ3ofWOH_ZK-TPr7M5AUY9KuD8969Qtd8MPrbf31tA/exec";

  const $ = id => document.getElementById(id);
  const msg = $("msg"), btn = $("btn");

  const today = new Date(); today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
  $("date").value = today.toISOString().slice(0, 10);

  $("type").addEventListener("change", () => { $("typeOther").hidden = $("type").value !== "Other"; });
  ["company", "plate", "remarks", "bookedBy", "typeOther"].forEach(id =>
    $(id).addEventListener("input", e => {
      const s = e.target.selectionStart; e.target.value = e.target.value.toUpperCase();
      e.target.setSelectionRange(s, s);
    }));

  function send(data) {
    return new Promise((resolve, reject) => {
      if (window.google && google.script && google.script.run) {            // inside Apps Script
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).submitBooking(data);
      } else {                                                              // standalone page
        if (SCRIPT_URL.startsWith("PASTE")) return reject(new Error("Setup not finished: add the Web App URL."));
        fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                            body: JSON.stringify(data) })
          .then(r => r.json()).then(resolve).catch(() =>
            reject(new Error("Could not confirm the booking. Check the sheet before submitting again.")));
      }
    });
  }

  $("f").addEventListener("submit", async e => {
    e.preventDefault();
    const data = {
      date: $("date").value, time: $("time").value,
      type: $("type").value === "Other" ? $("typeOther").value : $("type").value,
      company: $("company").value, plate: $("plate").value, contact: $("contact").value,
      remarks: $("remarks").value, bookedBy: $("bookedBy").value
    };
    btn.disabled = true; btn.textContent = "Sending...";
    msg.className = ""; msg.textContent = "";
    try {
      const res = await send(data);
      msg.className = res.ok ? "ok" : "err";
      msg.textContent = (res.ok ? "✅ " : "❌ ") + res.message;
      if (res.ok) {
        ["company", "plate", "contact", "remarks", "typeOther"].forEach(id => $(id).value = "");
        $("type").value = "10W"; $("typeOther").hidden = true;
        $("company").focus();   // date, time and booked by stay for the next truck
      }
    } catch (err) {
      msg.className = "err";
      msg.textContent = "❌ " + String(err.message || err).replace(/^Error:\s*/, "");
    }
    btn.disabled = false; btn.textContent = "Submit Booking";
  });
</script>
</body>
</html>
