<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Truck Booking - Roxas to Batangas</title>
  <style>
    :root {
      --bg: #eef1f5;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --accent: #d97706;
      --border: #d1d5db;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Arial, sans-serif;
      padding: 16px;
    }
    .card {
      background: var(--card);
      width: 100%;
      max-width: 480px;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,.1);
      align-self: flex-start;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 22px;
    }
    p.sub {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 600;
      font-size: 14px;
    }
    .req::after {
      content: " *";
      color: #dc2626;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--accent);
      border-color: var(--accent);
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .up { text-transform: uppercase; }
    button {
      margin-top: 22px;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    #msg {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .ok {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }
    .err {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚚 Truck Booking</h1>
    <p class="sub">Roxas → Batangas • Fields marked * are required</p>

    <form id="f" autocomplete="off">
      <div class="row">
        <div>
          <label class="req" for="date">Departure Date</label>
          <input id="date" type="date" required>
        </div>
        <div>
          <label for="time">Time</label>
          <select id="time">
            <option value="1:00 AM">1:00 AM</option>
            <option value="1:00 PM">1:00 PM</option>
          </select>
        </div>
      </div>

      <label for="type">Type of Vehicle</label>
      <select id="type">
        <option value="10W" selected>10W</option>
        <option value="20FTR">20FTR</option>
        <option value="40FTR">40FTR</option>
        <option value="FWD">FWD</option>
        <option value="ELF">ELF</option>
        <option value="6W">6W</option>
        <option value="12W">12W</option>
        <option value="Other">Other</option>
      </select>
      <input id="typeOther" class="up" placeholder="Type the vehicle type" hidden style="margin-top:8px">

      <label class="req" for="company">Company Name</label>
      <input id="company" class="up" required>

      <label class="req" for="plate">Plate Number</label>
      <input id="plate" class="up" required placeholder="e.g. CCR 8351">

      <label for="contact">Contact Number</label>
      <input id="contact" type="tel" placeholder="e.g. 09218010894">

      <label for="remarks">Remarks</label>
      <textarea id="remarks" class="up" rows="2"></textarea>

      <label class="req" for="bookedBy">Booked By</label>
      <input id="bookedBy" class="up" required>

      <button id="btn" type="submit">Submit Booking</button>
      <div id="msg"></div>
    </form>
  </div>

  <script>
    // ========== YOUR WEB APP URL ==========
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1GggA7uj1WJNIr7uQg_cqeOq1GZsSdwUUL8F5KnKG1mEjli7J0_xDHxueVfSJHY1nsQ/exec";

    const $ = id => document.getElementById(id);
    const msg = $("msg");
    const btn = $("btn");

    // Set today's date as default
    const today = new Date();
    today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
    $("date").value = today.toISOString().slice(0, 10);

    // Show/hide "Other" vehicle type
    $("type").addEventListener("change", () => {
      $("typeOther").hidden = $("type").value !== "Other";
    });

    // Force UPPERCASE while typing
    ["company", "plate", "remarks", "bookedBy", "typeOther"].forEach(id => {
      $(id).addEventListener("input", e => {
        const start = e.target.selectionStart;
        e.target.value = e.target.value.toUpperCase();
        e.target.setSelectionRange(start, start);
      });
    });

    function send(data) {
      return new Promise((resolve, reject) => {
        // Inside Google Apps Script
        if (window.google && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .submitBooking(data);
        } 
        // Standalone mode
        else {
          fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(data)
          })
          .then(r => r.json())
          .then(resolve)
          .catch(() => reject(new Error("Network error. Please try again.")));
        }
      });
    }

    $("f").addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        date: $("date").value,
        time: $("time").value,
        type: $("type").value === "Other" ? $("typeOther").value : $("type").value,
        company: $("company").value.trim(),
        plate: $("plate").value.trim(),
        contact: $("contact").value.trim(),
        remarks: $("remarks").value.trim(),
        bookedBy: $("bookedBy").value.trim()
      };

      btn.disabled = true;
      btn.textContent = "Sending...";
      msg.className = "";
      msg.textContent = "";

      try {
        const res = await send(data);

        msg.className = res.ok ? "ok" : "err";
        msg.textContent = (res.ok ? "✅ " : "❌ ") + res.message;

        if (res.ok) {
          // Clear fields for next booking (keep Date, Time, and Booked By)
          ["company", "plate", "contact", "remarks", "typeOther"].forEach(id => $(id).value = "");
          $("type").value = "10W";
          $("typeOther").hidden = true;
          $("company").focus();
        }
      } catch (err) {
        msg.className = "err";
        msg.textContent = "❌ " + (err.message || err);
      }

      btn.disabled = false;
      btn.textContent = "Submit Booking";
    });
  </script>
</body>
</html>
